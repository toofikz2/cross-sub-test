name: blocked-by-leak-test
on: workflow_dispatch
permissions:
  contents: read
  issues: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query blockedBy field
        run: |
          cat > /tmp/query.json << 'QUERYEOF'
          {"query": "query { node(id: \"I_kwDOTM5UB88AAAABLGYWwg\") { ... on Issue { title blockedBy(first: 5) { nodes { title number repository { nameWithOwner isPrivate } } } } } }"}
          QUERYEOF
          curl -sv -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" -X POST https://api.github.com/graphql -d @/tmp/query.json 2>&1
