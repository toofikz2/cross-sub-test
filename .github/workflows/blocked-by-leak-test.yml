name: blocked-by-leak-test
on: workflow_dispatch
permissions:
  contents: read
  issues: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Query blockedBy field
        run: |
          echo "Testing blockedBy field"
          RESULT=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/json" -X POST https://api.github.com/graphql -d '{"query": "query { node(id: \\"I_kwDOTM5UB88AAAABLGYWwg\\") { ... on Issue { title blockedBy(first: 5) { nodes { title number repository { nameWithOwner isPrivate } } } } } }"}')
          echo "$RESULT"
